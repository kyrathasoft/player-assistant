name: Deploy PWA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-release-transactions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PWA to DreamHost
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload and verify PWA
        shell: pwsh
        env:
          DREAMHOST_SSH_PRIVATE_KEY_B64: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DREAMHOST_SSH_PRIVATE_KEY_B64)) {
            throw 'The DREAMHOST_SSH_PRIVATE_KEY_B64 repository secret is required for PWA deployment.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-dreamhost-deploy.key'
          try {
            $keyBytes = [System.Convert]::FromBase64String($env:DREAMHOST_SSH_PRIVATE_KEY_B64)
          }
          catch {
            throw 'The DREAMHOST_SSH_PRIVATE_KEY_B64 repository secret is not valid base64.'
          }
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          $keyIdentity = "$env:USERDOMAIN\$env:USERNAME"
          & icacls.exe $keyPath /inheritance:r /grant:r ("{0}:(R)" -f $keyIdentity) | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not restrict the DreamHost deployment key to the GitHub Actions runner account.'
          }
          try {
            $files = @(
              '.htaccess', 'index.html', 'styles.css', 'version.js', 'app.js', 'service-worker.js',
              'translator-worker.js', 'campaign-search-worker.js', 'optional-pack-loader.js', 'optional-packs.json', 'offline.html',
              'manifest.webmanifest', 'icons/icon-192.png', 'icons/icon-512.png',
              'icons/dragon-mark.png', 'data/orcish.json', 'data/elvish.json',
              'data/ghukliak.json', 'data/heroes.json', 'level-progression.json',
              'magic-items.json', 'data/party-funds.json', 'quests.json', 'campaign-search.json'
            )
            & .\web-deploy\deploy-pwa-files.ps1 `
              -DreamHostTarget 'dh_4gg2za@pdx1-shared-a1-13.dreamhost.com' `
              -RemoteDirectory '/home/dh_4gg2za/bryanmiller.us/scarlethorizons/pwa' `
              -SshKeyPath $keyPath `
              -KnownHostsPath '.\web-deploy\dreamhost_known_hosts' `
              -Files $files
            if ($LASTEXITCODE -ne 0) { throw 'The PWA deployment or production verification failed.' }
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }
