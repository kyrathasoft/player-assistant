name: PR smoke

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fast PR smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, pdo_sqlite, sodium, sqlite3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA browser test dependencies
        shell: pwsh
        run: |
          npm ci --prefix .\pwa
          npx --prefix .\pwa playwright install chromium

      - name: Verify full-regression policy wiring
        shell: pwsh
        run: .\verify-full-regression-ci.ps1

      - name: Verify test harness structure
        shell: pwsh
        run: .\verify-test-harness-structure.ps1

      - name: Lint PHP test and broker files
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .\web-deploy -Recurse -Filter '*.php' -File |
            ForEach-Object { php -l $_.FullName }

      - name: Verify broker schema drift contract
        shell: pwsh
        run: php .\web-deploy\tests\schema-drift-tests.php

      - name: Rehearse broker migrations and rollback boundaries
        shell: pwsh
        run: php .\web-deploy\tests\migration-rehearsal-tests.php

      - name: Check browser smoke script syntax
        shell: pwsh
        run: node --check .\pwa\browser-smoke.mjs

      - name: Run PWA static verification
        shell: pwsh
        run: .\pwa\verify-pwa.ps1

      - name: Run production-response contract tests
        shell: pwsh
        run: .\web-deploy\tests\pwa-monitor-contract-tests.ps1

      - name: Protected-data negative-space verification
        shell: pwsh
        run: .\verify-protected-data-negative-space.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Run PWA browser smoke tests
        shell: pwsh
        run: npm --prefix .\pwa test
