name: Deploy PWA campaign word count

on:
  push:
    branches:
      - master
    paths:
      - 'pwa/campaign-search.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy campaign word count to DreamHost
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload and verify campaign-search.json
        shell: pwsh
        env:
          DREAMHOST_SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DREAMHOST_SSH_PRIVATE_KEY)) {
            throw 'The DREAMHOST_SSH_PRIVATE_KEY repository secret is required for PWA deployment.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-dreamhost-deploy.key'
          [System.IO.File]::WriteAllText($keyPath, $env:DREAMHOST_SSH_PRIVATE_KEY, [System.Text.ASCIIEncoding]::new())
          $sshTarget = 'dh_4gg2za@pdx1-shared-a1-13.dreamhost.com'
          $remoteDirectory = '/home/dh_4gg2za/bryanmiller.us/scarlethorizons/pwa'
          $sshOptions = @('-i', $keyPath, '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15')
          try {
            & ssh.exe @sshOptions $sshTarget "test -d $remoteDirectory && test -w $remoteDirectory"
            if ($LASTEXITCODE -ne 0) { throw 'DreamHost destination preflight failed.' }
            & scp.exe @sshOptions '.\pwa\campaign-search.json' "$sshTarget`:$remoteDirectory/"
            if ($LASTEXITCODE -ne 0) { throw 'DreamHost campaign-search upload failed.' }
            $localHash = (Get-FileHash -LiteralPath '.\pwa\campaign-search.json' -Algorithm SHA256).Hash.ToLowerInvariant()
            $remoteHash = (& ssh.exe @sshOptions $sshTarget "cd $remoteDirectory && sha256sum campaign-search.json").Trim().Split()[0].ToLowerInvariant()
            if ($localHash -ne $remoteHash) {
              throw "DreamHost SHA-256 mismatch: local $localHash, remote $remoteHash."
            }
            Write-Output "DreamHost campaign-search.json SHA-256 verified: $localHash"
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Run production PWA deployment verifier
        shell: pwsh
        run: .\pwa\test-deployment.ps1