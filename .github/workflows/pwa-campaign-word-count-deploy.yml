name: Deploy PWA campaign word count

on:
  push:
    branches:
      - master
    paths:
      - 'pwa/campaign-search.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-release-transactions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy campaign word count to DreamHost
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload and verify campaign-search.json
        shell: pwsh
        env:
          DREAMHOST_SSH_PRIVATE_KEY_B64: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DREAMHOST_SSH_PRIVATE_KEY_B64)) {
            throw 'The DREAMHOST_SSH_PRIVATE_KEY_B64 repository secret is required for PWA deployment.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-dreamhost-deploy.key'
          try {
            $keyBytes = [System.Convert]::FromBase64String($env:DREAMHOST_SSH_PRIVATE_KEY_B64)
          }
          catch {
            throw 'The DREAMHOST_SSH_PRIVATE_KEY_B64 repository secret is not valid base64.'
          }
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          try {
            & .\web-deploy\deploy-pwa-files.ps1 `
              -DreamHostTarget 'dh_4gg2za@pdx1-shared-a1-13.dreamhost.com' `
              -RemoteDirectory '/home/dh_4gg2za/bryanmiller.us/scarlethorizons/pwa' `
              -SshKeyPath $keyPath `
              -KnownHostsPath '.\web-deploy\dreamhost_known_hosts' `
              -Files @('campaign-search.json')
            if ($LASTEXITCODE -ne 0) { throw 'The campaign-search deployment or production verification failed.' }
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Run production PWA deployment verifier
        shell: pwsh
        run: .\pwa\test-deployment.ps1