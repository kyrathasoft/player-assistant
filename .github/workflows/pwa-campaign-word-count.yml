name: Refresh PWA campaign word count

on:
  # GitHub Actions cron is UTC. Running at both UTC hours lets the script
  # select 07:00 in America/Chicago across standard and daylight time.
  schedule:
    - cron: '0 12,13 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh immediately instead of waiting for the Friday 07:00 Central window'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pwa-campaign-word-count-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh campaign word count
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Refresh the PWA campaign search index
        shell: pwsh
        env:
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          if ($env:FORCE_REFRESH -eq 'true') {
            .\pwa\refresh-campaign-search-scheduled.ps1 -Force
          }
          else {
            .\pwa\refresh-campaign-search-scheduled.ps1
          }

      - name: Commit refreshed index
        shell: pwsh
        run: |
          if (git diff --quiet -- .\pwa\campaign-search.json) {
            Write-Output 'The campaign search index is unchanged.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .\pwa\campaign-search.json
          git commit -m 'chore(pwa): refresh campaign word count'
          git push

      - name: Deploy refreshed index to DreamHost
        shell: pwsh
        env:
          DREAMHOST_SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DREAMHOST_SSH_PRIVATE_KEY)) {
            throw 'The DREAMHOST_SSH_PRIVATE_KEY repository secret is required for scheduled PWA deployment.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-dreamhost-deploy.key'
          [System.IO.File]::WriteAllText($keyPath, $env:DREAMHOST_SSH_PRIVATE_KEY, [System.Text.ASCIIEncoding]::new())
          $sshTarget = 'dh_4gg2za@pdx1-shared-a1-13.dreamhost.com'
          $remoteDirectory = '/home/dh_4gg2za/bryanmiller.us/scarlethorizons/pwa'
          $sshOptions = @('-i', $keyPath, '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=15')
          try {
            & ssh.exe @sshOptions $sshTarget "test -d $remoteDirectory && test -w $remoteDirectory"
            if ($LASTEXITCODE -ne 0) { throw 'DreamHost destination preflight failed.' }
            & scp.exe @sshOptions '.\pwa\campaign-search.json' "$sshTarget`:$remoteDirectory/"
            if ($LASTEXITCODE -ne 0) { throw 'DreamHost campaign-search upload failed.' }
            $localHash = (Get-FileHash -LiteralPath '.\pwa\campaign-search.json' -Algorithm SHA256).Hash.ToLowerInvariant()
            $remoteHash = (& ssh.exe @sshOptions $sshTarget "cd $remoteDirectory && sha256sum campaign-search.json").Trim().Split()[0].ToLowerInvariant()
            if ($localHash -ne $remoteHash) {
              throw "DreamHost SHA-256 mismatch: local $localHash, remote $remoteHash."
            }
            Write-Output "DreamHost campaign-search.json SHA-256 verified: $localHash"
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }
