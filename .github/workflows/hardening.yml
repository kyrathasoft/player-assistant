name: Full regression

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_DIR: ${{ github.workspace }}\Release
  PUBLISH_DIR: ${{ github.workspace }}\Release\publish
  INSTALLER_DIR: ${{ github.workspace }}\Release\installer
  UPDATE_MANIFEST_PATH: ${{ github.workspace }}\Release\installer\p-assist-updates.json
  UPDATE_MANIFEST_SIGNATURE_PATH: ${{ github.workspace }}\Release\installer\p-assist-updates.json.sig
  UPDATE_MANIFEST_PUBLIC_KEY_PATH: ${{ github.workspace }}\Release\installer\p-assist-updates.public-key.xml
  DIAGNOSTICS_DIR: ${{ github.workspace }}\codex-scratch\ci-diagnostics
  RC_DRY_RUN_JSON: ${{ github.workspace }}\codex-scratch\ci-rc-dry-run.json
  DEPENDENCY_INVENTORY_JSON: ${{ github.workspace }}\codex-scratch\rc-dependency-inventory.json

jobs:
  parallel-test-groups:
    name: Parallel test group (${{ matrix.group }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - pwa
          - php
          - browser
          - powershell

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        if: matrix.group == 'pwa' || matrix.group == 'browser'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Setup PHP
        if: matrix.group == 'php' || matrix.group == 'powershell'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, openssl, pdo_sqlite, sodium, sqlite3

      - name: Prepare PHP dependency cache
        if: matrix.group == 'php'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$HOME\.composer\cache" | Out-Null

      - name: Cache PHP dependencies
        if: matrix.group == 'php'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\.composer\cache
          key: php-composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            php-composer-${{ runner.os }}-

      - name: Cache Playwright browsers
        if: matrix.group == 'pwa' || matrix.group == 'browser'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pwa/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install PWA browser test dependencies
        if: matrix.group == 'pwa' || matrix.group == 'browser'
        shell: pwsh
        run: |
          npm ci --prefix .\pwa
          npx --prefix .\pwa playwright install chromium

      - name: Run PWA verification
        if: matrix.group == 'pwa'
        shell: pwsh
        run: .\pwa\verify-pwa.ps1

      - name: Run optional-pack focused suites
        if: matrix.group == 'pwa'
        shell: pwsh
        run: |
          node .\pwa\optional-pack-tests.mjs
          node .\pwa\optional-pack-lifecycle-tests.mjs

      - name: Run PHP broker suites
        if: matrix.group == 'php'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath .\web-deploy\tests -Filter '*-tests.php' -File |
            Sort-Object Name |
            ForEach-Object {
              $suite = $_
              & php $suite.FullName
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) {
                throw "PHP suite '$($suite.Name)' failed with exit code $exitCode."
              }
            }

      - name: Run browser-level PWA smoke tests
        if: matrix.group == 'browser'
        shell: pwsh
        run: npm --prefix .\pwa test

      - name: Run PowerShell deployment and HTTP authentication suites
        if: matrix.group == 'powershell'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-CheckedVerification {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$FilePath,
              [hashtable]$Parameters = @{}
            )

            & $FilePath @Parameters
            if (-not $?) {
              $exitCode = if ($null -eq $LASTEXITCODE) { 1 } else { $LASTEXITCODE }
              throw "Verification '$Name' failed with exit code $exitCode."
            }
          }

          Invoke-CheckedVerification 'word-count schedule' '.\verify-word-count-schedule.ps1'
          Invoke-CheckedVerification 'backup encryption' './web-deploy/tests/backup-encryption-tests.ps1'
          Invoke-CheckedVerification 'published word counts' './web-deploy/tests/publish-word-counts-tests.ps1'
          Invoke-CheckedVerification 'PWA monitor contract' './web-deploy/tests/pwa-monitor-contract-tests.ps1'
          & (Get-Command php).Source './web-deploy/tests/authorization-policy-tests.php'
          if (-not $?) { throw "Verification 'authorization policy' failed with exit code $LASTEXITCODE." }
          Invoke-CheckedVerification 'HTTP authentication' './web-deploy/tests/run-http-auth-tests.ps1' -Parameters @{ PhpPath = (Get-Command php).Source }

  # Keep this job name aligned with the required GitHub Actions check on master.
  full-regression:
    name: Required full regression
    runs-on: windows-latest
    timeout-minutes: 90
    needs: parallel-test-groups
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP for desktop boundary tests
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, openssl, pdo_sqlite, sodium, sqlite3

      - name: Load canonical version metadata
        shell: pwsh
        run: |
          . .\version-metadata.ps1
          $metadata = Get-PlayerAssistantVersionMetadata -RepoRoot $env:GITHUB_WORKSPACE
          "PLAYER_ASSISTANT_VERSION=$($metadata.Version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_PACKAGE_PATH=$env:INSTALLER_DIR\player-assistant-$($metadata.Version)-installer.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPDATE_ARCHIVE_PATH=$env:INSTALLER_DIR\p-assist-$($metadata.InstallerVersion).zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPDATE_INSTALLER_PATH=$env:INSTALLER_DIR\p-assist-$($metadata.InstallerVersion).exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify repository hygiene
        shell: pwsh
        run: .\verify-repository-hygiene.ps1

      - name: Verify measurable resource budgets
        shell: pwsh
        run: .\verify-resource-budgets.ps1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.301

      - name: Cache .NET dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\.nuget\packages
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            dotnet-${{ runner.os }}-

      - name: Verify parallel test groups
        shell: pwsh
        run: |
          if ('${{ needs.parallel-test-groups.result }}' -ne 'success') {
            throw "One or more parallel test groups failed."
          }

      - name: Verify required CI policy
        shell: pwsh
        run: .\verify-full-regression-ci.ps1

      - name: Verify native test fail-fast policy
        shell: pwsh
        run: .\verify-native-test-fail-fast.ps1

      - name: Verify locked .NET dependencies
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -Directory -Force |
            Where-Object { $_.Name -eq 'obj' } |
            Remove-Item -Recurse -Force
          dotnet nuget locals all --clear
          .\verify-dotnet-dependencies.ps1

      - name: Verify test harness structure
        shell: pwsh
        run: .\verify-test-harness-structure.ps1

      - name: Verify canonical lexicon artifacts
        run: python .\verify-lexicon-artifacts.py

      - name: Verify canonical version metadata
        run: python .\verify-version-metadata.py

      - name: Install pinned Inno Setup 7.1.0 x64
        shell: pwsh
        run: |
          $packagePath = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $packagePath
          .\verify-inno-setup.ps1 -PackagePath $packagePath -PackageOnly
          $process = Start-Process -FilePath $packagePath -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($process.ExitCode)." }
          .\verify-inno-setup.ps1 -CompilerPath "$env:ProgramFiles\Inno Setup 7\ISCC.exe" -PackagePath $packagePath

      - name: Build Release app
        shell: pwsh
        run: dotnet build .\player-assistant.csproj --configuration Release --nologo --no-restore

      - name: Build Release ToOrcish
        shell: pwsh
        run: dotnet build .\ToOrcish\to-orcish.csproj --configuration Release --nologo --no-restore

      - name: Build Release test harness
        shell: pwsh
        run: dotnet build .\PlayerAssistant.Tests\PlayerAssistant.Tests.csproj --configuration Release --nologo --no-restore -p:UseSharedCompilation=false

      - name: Install .NET Playwright browser
        shell: pwsh
        run: .\PlayerAssistant.Tests\bin\Release\net10.0-windows\playwright.ps1 install chromium

      - name: Verify .NET formatting
        shell: pwsh
        run: dotnet format .\player-assistant.slnx --verify-no-changes --no-restore


      - name: Seed CI local sidecars
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .\settings.local.json -PathType Leaf)) {
            [ordered]@{
              schema_version = 1
              'XP Tracking' = 'https://publish.obsidian.md/scarlethorizons/Intentional+Orphans/XP+Tracking'
              'RPOL user name' = 'ci-fixture-rpol-user'
              'RPOL password' = 'ci-fixture-rpol-password'
            } |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath .\settings.local.json -Encoding UTF8
          }

          if (-not (Test-Path -LiteralPath .\xp-passwords.json -PathType Leaf)) {
            $entries = foreach ($identity in @(
              @{ Name = 'Dungeon Master'; Id = 'ci-dungeon-master'; IsDungeonMaster = $true },
              @{ Name = 'Kelpie'; Id = 'ci-kelpie'; IsDungeonMaster = $false }
            )) {
              $salt = [Security.Cryptography.RandomNumberGenerator]::GetBytes(16)
              $hash = [Security.Cryptography.Rfc2898DeriveBytes]::Pbkdf2(
                'ci-fixture-password',
                $salt,
                600000,
                [Security.Cryptography.HashAlgorithmName]::SHA256,
                32)
              [ordered]@{
                canonical_name = $identity.Name
                canonical_id = $identity.Id
                aliases = @()
                is_dungeon_master = [bool]$identity.IsDungeonMaster
                algorithm = 'PBKDF2-HMAC-SHA256'
                iterations = 600000
                salt = [Convert]::ToBase64String($salt)
                hash = [Convert]::ToBase64String($hash)
              }
              [Security.Cryptography.CryptographicOperations]::ZeroMemory($hash)
            }

            [ordered]@{
              schema_version = 2
              format = 'xp-password-hashes-v2'
              entries = @($entries)
            } |
              ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath .\xp-passwords.json -Encoding UTF8
          }

      - name: Seed Release runtime artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = $env:RELEASE_DIR
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $settings = Get-Content -Raw -LiteralPath .\settings.json | ConvertFrom-Json
          $vaultUrl = ([string]$settings.'Obsidian Game Vault').TrimEnd('/')
          if ([string]::IsNullOrWhiteSpace($vaultUrl)) {
            throw "settings.json is missing 'Obsidian Game Vault'."
          }

          $sitemapUrl = "$vaultUrl/sitemap.xml"
          $sitemapPath = Join-Path $releaseDir 'sitemap.xml'
          $keywordUrlPath = Join-Path $releaseDir 'sitemap-keyword-urls.json'
          $keywordIndexPath = Join-Path $releaseDir 'keyword-index.json'
          $keywordTermsPath = Join-Path $releaseDir 'game-posts-key-terms.md'

          Invoke-WebRequest -Uri $sitemapUrl -OutFile $sitemapPath
          [xml]$sitemap = Get-Content -Raw -LiteralPath $sitemapPath

          $urls = @(
            $sitemap.urlset.url |
              ForEach-Object { [string]$_.loc } |
              Where-Object { ![string]::IsNullOrWhiteSpace($_) } |
              Sort-Object -Unique
          )
          if ($urls.Count -le 0) {
            throw "No URLs were found in $sitemapUrl."
          }

          $urlSources = [ordered]@{}
          $keywordUrls = [ordered]@{}
          $keywordWords = [ordered]@{}
          $termSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $generatedAt = (Get-Date).ToString('O')

          foreach ($url in $urls) {
            $urlSources[$url] = [ordered]@{ source = 'obsidian' }

            $uri = [System.Uri]$url
            $segments = @($uri.AbsolutePath -split '/')
            $slug = ($segments | Where-Object { $_ } | Select-Object -Last 1)
            if ([string]::IsNullOrWhiteSpace($slug)) {
              continue
            }

            $decodedSlug = [System.Uri]::UnescapeDataString($slug)
            $candidateTerms = @(
              $decodedSlug
              ($decodedSlug -replace '[-_]+', ' ')
            )

            foreach ($candidate in $candidateTerms) {
              foreach ($part in ($candidate -split '[^A-Za-z0-9]+')) {
                $term = $part.Trim()
                if ($term.Length -lt 3) {
                  continue
                }

                if ($termSet.Add($term)) {
                  $keywordUrls[$term] = @($url)
                  $keywordWords[$term] = [ordered]@{
                    total_occurrences = 1
                    matches = @(
                      [ordered]@{
                        url = $url
                        count = 1
                        last_indexed = $generatedAt
                      }
                    )
                  }
                }
                else {
                  $existingUrls = [System.Collections.Generic.List[string]]::new()
                  foreach ($existingUrl in @($keywordUrls[$term])) {
                    [void]$existingUrls.Add([string]$existingUrl)
                  }
                  if (-not $existingUrls.Contains($url)) {
                    [void]$existingUrls.Add($url)
                    $keywordUrls[$term] = @($existingUrls.ToArray())
                  }

                  $entry = $keywordWords[$term]
                  $entry.total_occurrences = [int]$entry.total_occurrences + 1
                  $matches = [System.Collections.Generic.List[object]]::new()
                  foreach ($match in @($entry.matches)) {
                    $matches.Add($match) | Out-Null
                  }
                  $matches.Add([ordered]@{
                    url = $url
                    count = 1
                    last_indexed = $generatedAt
                  }) | Out-Null
                  $entry.matches = @($matches.ToArray())
                  $keywordWords[$term] = $entry
                }
              }
            }
          }

          if ($termSet.Count -le 0) {
            throw "No keyword terms were derived from $sitemapUrl."
          }

          $terms = [string[]]@($termSet)
          [Array]::Sort($terms, [System.StringComparer]::OrdinalIgnoreCase)

          $keywordUrlDocument = $keywordUrls | ConvertTo-Json -Depth 20
          $keywordIndexDocument = [ordered]@{
            index_metadata = [ordered]@{
              generated_at = $generatedAt
              total_words_indexed = $terms.Count
            }
            urls = $urlSources
            words = $keywordWords
          } | ConvertTo-Json -Depth 20

          [System.IO.File]::WriteAllText($keywordUrlPath, $keywordUrlDocument + "`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($keywordIndexPath, $keywordIndexDocument + "`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllLines($keywordTermsPath, $terms, [System.Text.UTF8Encoding]::new($false))

      - name: Publish and verify
        shell: pwsh
        run: .\publish-player-assistant.ps1 -OutputDir $env:PUBLISH_DIR

      - name: Run complete desktop regression harness
        shell: pwsh
        run: .\PlayerAssistant.Tests\bin\Release\net10.0-windows\PlayerAssistant.Tests.exe

      - name: Build installer package
        shell: pwsh
        run: .\build-installer.ps1 -OutputDir $env:INSTALLER_DIR -PublishDir $env:PUBLISH_DIR -SkipPublish

      - name: Installer clean-machine smoke
        shell: pwsh
        run: .\verify-installer-clean-machine-smoke.ps1

      - name: Build ephemeral release update artifacts for untrusted events
        if: github.event_name != 'push'
        shell: pwsh
        run: >
          .\build-release-update-artifacts.ps1
          -OutputDir $env:INSTALLER_DIR
          -PublishDir $env:PUBLISH_DIR
          -GenerateEphemeralSigningKey

      - name: Build signed release update artifacts
        if: github.event_name == 'push'
        shell: pwsh
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_XML: ${{ secrets.PLAYER_ASSISTANT_UPDATE_MANIFEST_PRIVATE_KEY_XML }}
          UPDATE_MANIFEST_PUBLIC_KEY_XML: ${{ secrets.PLAYER_ASSISTANT_UPDATE_MANIFEST_PUBLIC_KEY_XML }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PRIVATE_KEY_XML)) {
            throw 'The PLAYER_ASSISTANT_UPDATE_MANIFEST_PRIVATE_KEY_XML secret is required for trusted release artifacts.'
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PUBLIC_KEY_XML)) {
            throw 'The PLAYER_ASSISTANT_UPDATE_MANIFEST_PUBLIC_KEY_XML secret is required for trusted release artifacts.'
          }
          $privateKeyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-update-manifest.private-key.xml'
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-update-manifest.public-key.xml'
          [System.IO.File]::WriteAllText($privateKeyPath, $env:UPDATE_MANIFEST_PRIVATE_KEY_XML, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($publicKeyPath, $env:UPDATE_MANIFEST_PUBLIC_KEY_XML, [System.Text.UTF8Encoding]::new($false))
          .\build-release-update-artifacts.ps1 `
            -OutputDir $env:INSTALLER_DIR `
            -PublishDir $env:PUBLISH_DIR `
            -PrivateKeyXmlPath $privateKeyPath `
            -ExpectedPublicKeyXmlPath $publicKeyPath

      - name: Verify signed release update artifacts
        if: github.event_name == 'push'
        shell: pwsh
        env:
          UPDATE_MANIFEST_PUBLIC_KEY_XML: ${{ secrets.PLAYER_ASSISTANT_UPDATE_MANIFEST_PUBLIC_KEY_XML }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PUBLIC_KEY_XML)) {
            throw 'The PLAYER_ASSISTANT_UPDATE_MANIFEST_PUBLIC_KEY_XML secret is required for trusted artifact verification.'
          }
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'player-assistant-update-manifest.public-key.xml'
          [System.IO.File]::WriteAllText($publicKeyPath, $env:UPDATE_MANIFEST_PUBLIC_KEY_XML, [System.Text.UTF8Encoding]::new($false))
          .\verify-release-update-artifacts.ps1 `
            -PublishArchivePath $env:UPDATE_ARCHIVE_PATH `
            -InstallerPath $env:UPDATE_INSTALLER_PATH `
            -ManifestPath $env:UPDATE_MANIFEST_PATH `
            -SignaturePath $env:UPDATE_MANIFEST_SIGNATURE_PATH `
            -PublicKeyXmlPath $env:UPDATE_MANIFEST_PUBLIC_KEY_PATH `
            -ExpectedPublicKeyXmlPath $publicKeyPath

      - name: Secret scan
        shell: pwsh
        run: .\verify-secret-scan.ps1 -RepoRoot $env:GITHUB_WORKSPACE -IncludeHistory

      - name: RC self-tests
        shell: pwsh
        run: .\verify-rc-self-tests.ps1 -ReleaseDir $env:RELEASE_DIR -PublishDir $env:PUBLISH_DIR

      - name: Collect diagnostics bundle
        shell: pwsh
        run: .\collect-diagnostics.ps1 -ReleaseDir $env:RELEASE_DIR -PublishDir $env:PUBLISH_DIR -OutputDir $env:DIAGNOSTICS_DIR -ConfirmExport

      - name: Verify diagnostics bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath $env:DIAGNOSTICS_DIR -Filter 'player-assistant-diagnostics-*.zip' -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $bundle) {
            throw "No diagnostics bundle zip was produced in $env:DIAGNOSTICS_DIR."
          }

          .\collect-diagnostics.ps1 -OutputDir $env:DIAGNOSTICS_DIR -VerifyOnly $bundle.FullName

      - name: RC checklist dry-run
        shell: pwsh
        run: >
          .\verify-rc-checklist.ps1
          -ReleaseDir $env:RELEASE_DIR
          -PublishDir $env:PUBLISH_DIR
          -DryRunJson $env:RC_DRY_RUN_JSON
          -SkipGit
          -SkipSecretScan
          -SkipSelfTests
          -SkipDiagnostics
          -SkipCodeSigning

      - name: Upload release installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-installer-artifacts
          if-no-files-found: error
          path: |
            ${{ env.INSTALLER_PACKAGE_PATH }}
            ${{ env.UPDATE_ARCHIVE_PATH }}
            ${{ env.UPDATE_INSTALLER_PATH }}
            ${{ env.UPDATE_MANIFEST_PATH }}
            ${{ env.UPDATE_MANIFEST_SIGNATURE_PATH }}
            ${{ env.UPDATE_MANIFEST_PUBLIC_KEY_PATH }}

      - name: Collect failed-run diagnostics
        if: failure()
        shell: pwsh
        run: .\collect-diagnostics.ps1 -ReleaseDir $env:RELEASE_DIR -PublishDir $env:PUBLISH_DIR -OutputDir $env:DIAGNOSTICS_DIR -KeepStaging -ConfirmExport

      - name: Upload failed-run hardening artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardening-failure-artifacts
          if-no-files-found: warn
          path: |
            ${{ env.RC_DRY_RUN_JSON }}
            ${{ env.DEPENDENCY_INVENTORY_JSON }}
            ${{ env.DIAGNOSTICS_DIR }}\*.zip
            ${{ env.DIAGNOSTICS_DIR }}\player-assistant-diagnostics-*
