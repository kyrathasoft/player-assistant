name: PWA synthetic monitor

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Production PWA synthetic monitor
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run authenticated PWA monitor
        shell: pwsh
        env:
          PWA_MONITOR_CHARACTER_NAME: ${{ secrets.PWA_MONITOR_CHARACTER_NAME }}
          PWA_MONITOR_PASSWORD: ${{ secrets.PWA_MONITOR_PASSWORD }}
        run: .\web-deploy\monitor-pwa.ps1 -RequireProtectedApi
